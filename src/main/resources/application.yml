spring:
  application:
    name: universalsql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usql}
    username: ${DB_USER:usql}
    password: ${DB_PASS:usql}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
      timeout: 2s
  bsp:
    schedule-delay: 5000    # export spans every 5s
  logs:
    exporter: none          # log lines go to Logback; skip double-export
  metrics:
    exporter: none          # metrics exported via Micrometer→Prometheus, not OTLP
  service:
    name: universalsql

logging:
  config: classpath:logback-spring.xml

usql:
  auth:
    mock-enabled: ${USQL_MOCK_AUTH:true}
    jwks-uri: ${USQL_JWKS_URI:http://localhost:8080/mock-jwks}

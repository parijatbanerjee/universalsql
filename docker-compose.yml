services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usql
      POSTGRES_USER: usql
      POSTGRES_PASSWORD: usql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usql"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  wiremock-jira:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock/jira:/home/wiremock

  wiremock-github:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/github:/home/wiremock
